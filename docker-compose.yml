services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ncpor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ncpor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ncpor}
    ports:
      # Host port 5433 so it does not clash with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncpor} -d ${POSTGRES_DB:-ncpor}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
